<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Galactic Defense 1984</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #060913;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 10px;
    }
    .hud {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }
    .hud-stat {
      background: #0f172a;
      border: 1px solid #1e293b;
      padding: 5px 12px;
      border-radius: 6px;
    }
    .hud-val { font-weight: 700; color: #38bdf8; margin-left: 4px; }
    .game-box {
      position: relative;
      background: #020617;
      border: 2px solid #1e293b;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 25px rgba(56, 189, 248, 0.15);
      overflow: hidden;
    }
    canvas { display: block; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.88);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      text-align: center;
      padding: 20px;
    }
    .overlay.hidden { display: none; }
    .overlay h2 { font-size: 24px; font-weight: 800; color: #38bdf8; }
    .overlay p { font-size: 13px; color: #94a3b8; max-width: 300px; line-height: 1.5; }
    .btn {
      background: #38bdf8;
      color: #020617;
      border: none;
      padding: 9px 22px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn:hover { background: #7dd3fc; }
    .controls-hint {
      margin-top: 10px;
      display: flex;
      gap: 12px;
      color: #64748b;
      font-size: 12px;
    }
    .mobile-controls {
      display: flex;
      gap: 16px;
      margin-top: 10px;
      width: 100%;
      max-width: 480px;
      justify-content: space-between;
    }
    .m-btn {
      background: #1e293b;
      color: #fff;
      border: 1px solid #334155;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .m-btn:active { background: #38bdf8; color: #020617; }
    @media (min-width: 640px) {
      .mobile-controls { display: none; }
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="hud-stat">SCORE <span class="hud-val" id="scoreEl">0</span></div>
    <div class="hud-stat">STAGE <span class="hud-val" id="stageEl">1</span></div>
    <div class="hud-stat">LIVES <span class="hud-val" id="livesEl">3</span></div>
  </div>

  <div class="game-box">
    <canvas id="cv" width="460" height="420"></canvas>

    <div id="startOverlay" class="overlay">
      <h2>GALACTIC DEFENSE</h2>
      <p>Repel descending alien squadrons. Take cover behind shield barricades and destroy the armada.</p>
      <button class="btn" id="startBtn">ENGAGE SQUADRON</button>
    </div>

    <div id="endOverlay" class="overlay hidden">
      <h2 id="endTitle" style="color: #ef4444;">MISSION FAILED</h2>
      <p id="endDesc">All planetary defenses exhausted.</p>
      <button class="btn" id="restartBtn">REDEPLOY CANNON</button>
    </div>
  </div>

  <div class="mobile-controls">
    <button class="m-btn" id="btnLeft">◀ LEFT</button>
    <button class="m-btn" id="btnShoot" style="background: #0284c7;">FIRE 🔥</button>
    <button class="m-btn" id="btnRight">RIGHT ▶</button>
  </div>

  <div class="controls-hint">
    <span>[A/D or ◀/▶] Move Cannon</span>
    <span>·</span>
    <span>[SPACE] Fire Laser</span>
  </div>

  <script>
    const canvas = document.getElementById('cv');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('scoreEl');
    const stageEl = document.getElementById('stageEl');
    const livesEl = document.getElementById('livesEl');
    const startOverlay = document.getElementById('startOverlay');
    const endOverlay = document.getElementById('endOverlay');
    const endTitle = document.getElementById('endTitle');
    const endDesc = document.getElementById('endDesc');

    let audioCtx = null;
    function beep(freq, type, dur, vol = 0.1) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(vol, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    let isPlaying = false;
    let score = 0;
    let stage = 1;
    let lives = 3;
    let player = { x: 215, y: 380, w: 30, h: 16, speed: 5 };
    let bullets = [];
    let alienBullets = [];
    let aliens = [];
    let alienDir = 1;
    let alienStepDown = false;
    let alienSpeed = 1;
    let lastAlienShoot = 0;
    let stars = [];
    let particles = [];
    let shields = [];

    // Keys
    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (e.key === ' ' && isPlaying) {
        shootBullet();
        e.preventDefault();
      }
    });
    window.addEventListener('keyup', e => keys[e.key] = false);

    // Starfield
    for (let i = 0; i < 45; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        s: Math.random() * 1.5 + 0.5,
        speed: Math.random() * 0.4 + 0.1
      });
    }

    function initShields() {
      shields = [];
      const count = 4;
      const spacing = canvas.width / (count + 1);
      for (let i = 1; i <= count; i++) {
        shields.push({
          x: spacing * i - 22,
          y: 320,
          w: 44,
          h: 22,
          hp: 12
        });
      }
    }

    function initAliens() {
      aliens = [];
      const rows = 4;
      const cols = 8;
      const startX = 40;
      const startY = 50;
      const gapX = 46;
      const gapY = 32;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          aliens.push({
            x: startX + c * gapX,
            y: startY + r * gapY,
            w: 24,
            h: 18,
            type: r,
            alive: true
          });
        }
      }
      alienDir = 1;
      alienSpeed = 0.8 + stage * 0.25;
    }

    function shootBullet() {
      if (bullets.length < 3) {
        bullets.push({ x: player.x + player.w / 2 - 1.5, y: player.y, w: 3, h: 10, speed: 7 });
        beep(880, 'square', 0.08, 0.08);
      }
    }

    function spawnExplosion(x, y, color) {
      for (let i = 0; i < 12; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.5) * 4,
          life: 25,
          color
        });
      }
    }

    function startGame() {
      score = 0;
      stage = 1;
      lives = 3;
      bullets = [];
      alienBullets = [];
      particles = [];
      scoreEl.innerText = '0';
      stageEl.innerText = '1';
      livesEl.innerText = '3';
      initShields();
      initAliens();
      startOverlay.classList.add('hidden');
      endOverlay.classList.add('hidden');
      isPlaying = true;
      requestAnimationFrame(loop);
    }

    function nextStage() {
      stage++;
      stageEl.innerText = stage;
      bullets = [];
      alienBullets = [];
      initShields();
      initAliens();
      beep(580, 'sine', 0.2);
    }

    function loop() {
      if (!isPlaying) return;

      // Update player
      if ((keys['ArrowLeft'] || keys['a'] || keys['A']) && player.x > 8) player.x -= player.speed;
      if ((keys['ArrowRight'] || keys['d'] || keys['D']) && player.x + player.w < canvas.width - 8) player.x += player.speed;

      // Update bullets
      bullets.forEach(b => b.y -= b.speed);
      bullets = bullets.filter(b => b.y > -10);

      // Alien movement
      let hitEdge = false;
      const liveAliens = aliens.filter(a => a.alive);
      if (liveAliens.length === 0) {
        nextStage();
        requestAnimationFrame(loop);
        return;
      }

      liveAliens.forEach(a => {
        a.x += alienSpeed * alienDir;
        if ((alienDir > 0 && a.x + a.w >= canvas.width - 15) || (alienDir < 0 && a.x <= 15)) {
          hitEdge = true;
        }
      });

      if (hitEdge) {
        alienDir *= -1;
        liveAliens.forEach(a => a.y += 12);
      }

      // Check alien reach bottom
      if (liveAliens.some(a => a.y + a.h >= player.y)) {
        gameOver(false);
        return;
      }

      // Alien shooting
      if (Date.now() - lastAlienShoot > Math.max(700, 1800 - stage * 200)) {
        lastAlienShoot = Date.now();
        const shooter = liveAliens[Math.floor(Math.random() * liveAliens.length)];
        if (shooter) {
          alienBullets.push({ x: shooter.x + shooter.w / 2, y: shooter.y + shooter.h, w: 2.5, h: 8, speed: 3.5 + stage * 0.3 });
        }
      }

      alienBullets.forEach(ab => ab.y += ab.speed);
      alienBullets = alienBullets.filter(ab => ab.y < canvas.height + 10);

      // Player bullet collisions with aliens
      bullets.forEach(b => {
        liveAliens.forEach(a => {
          if (b.x < a.x + a.w && b.x + b.w > a.x && b.y < a.y + a.h && b.y + b.h > a.y) {
            a.alive = false;
            b.y = -999;
            score += 20 + (3 - a.type) * 10;
            scoreEl.innerText = score;
            spawnExplosion(a.x + a.w / 2, a.y + a.h / 2, '#38bdf8');
            beep(340, 'triangle', 0.12);
          }
        });

        // Shields collision
        shields.forEach(s => {
          if (s.hp > 0 && b.x < s.x + s.w && b.x + b.w > s.x && b.y < s.y + s.h && b.y + b.h > s.y) {
            s.hp--;
            b.y = -999;
          }
        });
      });

      // Alien bullet collisions
      alienBullets.forEach(ab => {
        // Player hit
        if (ab.x < player.x + player.w && ab.x + ab.w > player.x && ab.y < player.y + player.h && ab.y + ab.h > player.y) {
          ab.y = 9999;
          lives--;
          livesEl.innerText = lives;
          spawnExplosion(player.x + player.w / 2, player.y + player.h / 2, '#ef4444');
          beep(140, 'sawtooth', 0.3);
          if (lives <= 0) {
            gameOver(false);
            return;
          }
        }
        // Shields
        shields.forEach(s => {
          if (s.hp > 0 && ab.x < s.x + s.w && ab.x + ab.w > s.x && ab.y < s.y + s.h && ab.y + ab.h > s.y) {
            s.hp--;
            ab.y = 9999;
          }
        });
      });

      // Particles
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
      });
      particles = particles.filter(p => p.life > 0);

      // Render
      render();
      requestAnimationFrame(loop);
    }

    function gameOver(win) {
      isPlaying = false;
      endTitle.innerText = win ? 'GALAXY SAVED!' : 'DEFENSE BREACHED';
      endTitle.style.color = win ? '#10b981' : '#ef4444';
      endDesc.innerText = `Final Score: ${score} · Cleared Stages: ${stage}`;
      endOverlay.classList.remove('hidden');
    }

    function render() {
      // Clear
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Stars
      ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
      stars.forEach(s => {
        s.y += s.speed;
        if (s.y > canvas.height) s.y = 0;
        ctx.fillRect(s.x, s.y, s.s, s.s);
      });

      // Shields
      shields.forEach(s => {
        if (s.hp > 0) {
          ctx.fillStyle = `rgba(16, 185, 129, ${s.hp / 12})`;
          ctx.fillRect(s.x, s.y, s.w, s.h);
          ctx.strokeStyle = '#34d399';
          ctx.strokeRect(s.x, s.y, s.w, s.h);
        }
      });

      // Player
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(player.x, player.y + 6, player.w, player.h - 6);
      ctx.fillRect(player.x + 10, player.y, 10, 6);

      // Player Bullets
      ctx.fillStyle = '#38bdf8';
      bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

      // Alien Bullets
      ctx.fillStyle = '#f43f5e';
      alienBullets.forEach(ab => ctx.fillRect(ab.x, ab.y, ab.w, ab.h));

      // Aliens
      aliens.forEach(a => {
        if (!a.alive) return;
        const colors = ['#f43f5e', '#a855f7', '#06b6d4', '#10b981'];
        ctx.fillStyle = colors[a.type % colors.length];

        // Draw pixel alien
        ctx.fillRect(a.x + 4, a.y, a.w - 8, 4);
        ctx.fillRect(a.x + 2, a.y + 4, a.w - 4, 8);
        ctx.fillRect(a.x, a.y + 12, 6, 6);
        ctx.fillRect(a.x + a.w - 6, a.y + 12, 6, 6);

        // Eyes
        ctx.fillStyle = '#020617';
        ctx.fillRect(a.x + 5, a.y + 6, 3, 3);
        ctx.fillRect(a.x + a.w - 8, a.y + 6, 3, 3);
      });

      // Particles
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 2, 2);
      });
    }

    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('restartBtn').addEventListener('click', startGame);

    // Mobile buttons
    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');
    const btnShoot = document.getElementById('btnShoot');

    btnLeft.addEventListener('touchstart', e => { e.preventDefault(); keys['ArrowLeft'] = true; });
    btnLeft.addEventListener('touchend', () => keys['ArrowLeft'] = false);
    btnRight.addEventListener('touchstart', e => { e.preventDefault(); keys['ArrowRight'] = true; });
    btnRight.addEventListener('touchend', () => keys['ArrowRight'] = false);
    btnShoot.addEventListener('click', () => { if (isPlaying) shootBullet(); });

    render();
  </script>
</body>
</html>
