<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Blazer Breakout</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #09090b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 10px;
    }
    .hud {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }
    .hud-stat {
      background: #18181b;
      border: 1px solid #27272a;
      padding: 5px 12px;
      border-radius: 6px;
    }
    .hud-val { font-weight: 700; color: #ec4899; margin-left: 4px; }
    .game-box {
      position: relative;
      background: #09090b;
      border: 2px solid #27272a;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 25px rgba(236, 72, 153, 0.15);
      overflow: hidden;
      cursor: none;
    }
    canvas { display: block; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 9, 11, 0.9);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      text-align: center;
      padding: 20px;
      cursor: default;
    }
    .overlay.hidden { display: none; }
    .overlay h2 { font-size: 24px; font-weight: 800; color: #ec4899; }
    .overlay p { font-size: 13px; color: #a1a1aa; max-width: 300px; line-height: 1.5; }
    .btn {
      background: #ec4899;
      color: #09090b;
      border: none;
      padding: 9px 22px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn:hover { background: #f472b6; }
    .hint { margin-top: 8px; font-size: 12px; color: #71717a; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="hud-stat">SCORE <span class="hud-val" id="scoreEl">0</span></div>
    <div class="hud-stat">COMBO <span class="hud-val" id="comboEl">x1</span></div>
    <div class="hud-stat">BALLS <span class="hud-val" id="livesEl">3</span></div>
  </div>

  <div class="game-box" id="box">
    <canvas id="cv" width="460" height="420"></canvas>

    <div id="startOverlay" class="overlay">
      <h2>NEON BLAZER</h2>
      <p>Deflect the energy sphere to shatter neon crystal barriers. Catch falling powerups to amplify firepower.</p>
      <button class="btn" id="startBtn">LAUNCH BALL</button>
    </div>

    <div id="endOverlay" class="overlay hidden">
      <h2 id="endTitle" style="color: #ef4444;">ARENA DEPLETED</h2>
      <p id="endDesc">Final score: 0</p>
      <button class="btn" id="restartBtn">RETRY ARENA</button>
    </div>
  </div>

  <div class="hint">Move mouse or [◀/▶ or A/D] to control paddle · [SPACE] to launch</div>

  <script>
    const canvas = document.getElementById('cv');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('scoreEl');
    const comboEl = document.getElementById('comboEl');
    const livesEl = document.getElementById('livesEl');
    const startOverlay = document.getElementById('startOverlay');
    const endOverlay = document.getElementById('endOverlay');
    const endTitle = document.getElementById('endTitle');
    const endDesc = document.getElementById('endDesc');

    let audioCtx = null;
    function beep(freq, type, dur, vol = 0.1) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(vol, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    let isPlaying = false;
    let score = 0;
    let lives = 3;
    let combo = 1;
    let paddle = { x: 190, y: 390, w: 80, h: 12, speed: 7 };
    let ball = { x: 230, y: 375, r: 6, vx: 3, vy: -4, stuck: true };
    let bricks = [];
    let particles = [];
    let powerups = [];

    const BRICK_ROWS = 5;
    const BRICK_COLS = 8;
    const BRICK_COLORS = ['#ec4899', '#8b5cf6', '#3b82f6', '#10b981', '#f59e0b'];

    function initBricks() {
      bricks = [];
      const brickW = 48;
      const brickH = 16;
      const startX = 28;
      const startY = 40;
      const gap = 6;

      for (let r = 0; r < BRICK_ROWS; r++) {
        for (let c = 0; c < BRICK_COLS; c++) {
          bricks.push({
            x: startX + c * (brickW + gap),
            y: startY + r * (brickH + gap),
            w: brickW,
            h: brickH,
            color: BRICK_COLORS[r],
            alive: true,
            pts: (5 - r) * 10
          });
        }
      }
    }

    function resetBall() {
      ball.stuck = true;
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - ball.r - 2;
      ball.vx = (Math.random() > 0.5 ? 1 : -1) * (3 + Math.random() * 1.5);
      ball.vy = -4.5;
      combo = 1;
      comboEl.innerText = 'x1';
    }

    function addExplosion(x, y, color) {
      for (let i = 0; i < 10; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 5,
          vy: (Math.random() - 0.5) * 5,
          life: 20,
          color
        });
      }
    }

    function startGame() {
      score = 0;
      lives = 3;
      combo = 1;
      paddle.w = 80;
      scoreEl.innerText = '0';
      comboEl.innerText = 'x1';
      livesEl.innerText = '3';
      initBricks();
      resetBall();
      startOverlay.classList.add('hidden');
      endOverlay.classList.add('hidden');
      isPlaying = true;
      requestAnimationFrame(loop);
    }

    function launch() {
      if (ball.stuck) {
        ball.stuck = false;
        beep(520, 'sine', 0.1);
      }
    }

    // Paddle controls
    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (e.key === ' ') {
        launch();
        e.preventDefault();
      }
    });
    window.addEventListener('keyup', e => keys[e.key] = false);

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      paddle.x = Math.max(0, Math.min(canvas.width - paddle.w, mouseX - paddle.w / 2));
      if (ball.stuck) {
        ball.x = paddle.x + paddle.w / 2;
      }
    });

    canvas.addEventListener('click', launch);

    function loop() {
      if (!isPlaying) return;

      // Keyboard paddle
      if ((keys['ArrowLeft'] || keys['a'] || keys['A']) && paddle.x > 0) {
        paddle.x -= paddle.speed;
        if (ball.stuck) ball.x = paddle.x + paddle.w / 2;
      }
      if ((keys['ArrowRight'] || keys['d'] || keys['D']) && paddle.x + paddle.w < canvas.width) {
        paddle.x += paddle.speed;
        if (ball.stuck) ball.x = paddle.x + paddle.w / 2;
      }

      if (!ball.stuck) {
        ball.x += ball.vx;
        ball.y += ball.vy;

        // Wall collision
        if (ball.x - ball.r <= 0) {
          ball.x = ball.r;
          ball.vx *= -1;
          beep(300, 'triangle', 0.05);
        } else if (ball.x + ball.r >= canvas.width) {
          ball.x = canvas.width - ball.r;
          ball.vx *= -1;
          beep(300, 'triangle', 0.05);
        }

        if (ball.y - ball.r <= 0) {
          ball.y = ball.r;
          ball.vy *= -1;
          beep(350, 'triangle', 0.05);
        }

        // Paddle collision
        if (
          ball.y + ball.r >= paddle.y &&
          ball.y - ball.r <= paddle.y + paddle.h &&
          ball.x >= paddle.x &&
          ball.x <= paddle.x + paddle.w &&
          ball.vy > 0
        ) {
          // calculate hit point offset (-1 to 1)
          const offset = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
          const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
          const angle = offset * (Math.PI / 3); // max 60 deg
          ball.vx = speed * Math.sin(angle);
          ball.vy = -Math.abs(speed * Math.cos(angle));
          combo = 1;
          comboEl.innerText = 'x1';
          beep(440, 'sine', 0.08);
        }

        // Bricks collision
        bricks.forEach(b => {
          if (!b.alive) return;
          if (
            ball.x + ball.r > b.x &&
            ball.x - ball.r < b.x + b.w &&
            ball.y + ball.r > b.y &&
            ball.y - ball.r < b.y + b.h
          ) {
            b.alive = false;
            ball.vy *= -1;
            score += b.pts * combo;
            scoreEl.innerText = score;
            combo++;
            comboEl.innerText = `x${combo}`;
            addExplosion(b.x + b.w / 2, b.y + b.h / 2, b.color);
            beep(600 + combo * 30, 'square', 0.06);

            // Powerup drop chance
            if (Math.random() < 0.2) {
              powerups.push({
                x: b.x + b.w / 2,
                y: b.y + b.h / 2,
                vy: 2,
                type: Math.random() > 0.5 ? 'wide' : 'laser'
              });
            }
          }
        });

        // Ball dropped out
        if (ball.y - ball.r > canvas.height) {
          lives--;
          livesEl.innerText = lives;
          beep(150, 'sawtooth', 0.25);
          if (lives <= 0) {
            endGame(false);
            return;
          } else {
            resetBall();
          }
        }

        // Win check
        if (bricks.every(b => !b.alive)) {
          endGame(true);
          return;
        }
      }

      // Powerups
      powerups.forEach(p => {
        p.y += p.vy;
        if (p.y >= paddle.y && p.y <= paddle.y + paddle.h && p.x >= paddle.x && p.x <= paddle.x + paddle.w) {
          p.y = 9999;
          paddle.w = Math.min(130, paddle.w + 25);
          score += 50;
          scoreEl.innerText = score;
          beep(880, 'sine', 0.15);
        }
      });
      powerups = powerups.filter(p => p.y < canvas.height + 20);

      // Particles
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
      });
      particles = particles.filter(p => p.life > 0);

      render();
      requestAnimationFrame(loop);
    }

    function endGame(win) {
      isPlaying = false;
      endTitle.innerText = win ? 'SECTOR CLEARED!' : 'SHIELD COLLAPSED';
      endTitle.style.color = win ? '#10b981' : '#ec4899';
      endDesc.innerText = `Final Score: ${score}`;
      endOverlay.classList.remove('hidden');
    }

    function render() {
      ctx.fillStyle = '#09090b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Bricks
      bricks.forEach(b => {
        if (!b.alive) return;
        ctx.fillStyle = b.color;
        ctx.shadowColor = b.color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.roundRect(b.x, b.y, b.w, b.h, 3);
        ctx.fill();
      });
      ctx.shadowBlur = 0;

      // Paddle
      ctx.fillStyle = '#ec4899';
      ctx.shadowColor = '#ec4899';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Ball
      ctx.fillStyle = '#fff';
      ctx.shadowColor = '#fff';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Powerups
      powerups.forEach(p => {
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
        ctx.fill();
      });

      // Particles
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 2, 2);
      });
    }

    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('restartBtn').addEventListener('click', startGame);

    initBricks();
    resetBall();
    render();
  </script>
</body>
</html>
