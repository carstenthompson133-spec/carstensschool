<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Flappy Orb Velocity</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #020617;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 10px;
    }
    .hud {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }
    .hud-stat {
      background: #0f172a;
      border: 1px solid #1e293b;
      padding: 5px 12px;
      border-radius: 6px;
    }
    .hud-val { font-weight: 700; color: #a855f7; margin-left: 4px; }
    .game-box {
      position: relative;
      background: #030712;
      border: 2px solid #1e293b;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 25px rgba(168, 85, 247, 0.15);
      overflow: hidden;
      cursor: pointer;
    }
    canvas { display: block; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 7, 18, 0.88);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      text-align: center;
      padding: 20px;
    }
    .overlay.hidden { display: none; }
    .overlay h2 { font-size: 24px; font-weight: 800; color: #a855f7; }
    .overlay p { font-size: 13px; color: #94a3b8; max-width: 260px; line-height: 1.5; }
    .btn {
      background: #a855f7;
      color: #030712;
      border: none;
      padding: 9px 22px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn:hover { background: #c084fc; }
    .hint { margin-top: 8px; font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="hud-stat">SCORE <span class="hud-val" id="scoreEl">0</span></div>
    <div class="hud-stat">HIGH <span class="hud-val" id="highEl">0</span></div>
  </div>

  <div class="game-box" id="box">
    <canvas id="cv" width="380" height="480"></canvas>

    <div id="startOverlay" class="overlay">
      <h2>FLAPPY ORB</h2>
      <p>Tap or press SPACE to propel the plasma orb. Navigate through electric conduits.</p>
      <button class="btn" id="startBtn">TAKEOFF</button>
    </div>

    <div id="endOverlay" class="overlay hidden">
      <h2 id="endTitle" style="color: #ef4444;">DISRUPTED</h2>
      <p id="endDesc">Final Score: 0</p>
      <button class="btn" id="restartBtn">RELAUNCH</button>
    </div>
  </div>

  <div class="hint">Click or press [SPACE] to boost upward</div>

  <script>
    const canvas = document.getElementById('cv');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('scoreEl');
    const highEl = document.getElementById('highEl');
    const startOverlay = document.getElementById('startOverlay');
    const endOverlay = document.getElementById('endOverlay');
    const endDesc = document.getElementById('endDesc');

    let audioCtx = null;
    function beep(freq, type = 'sine', dur = 0.08) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(0.1, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    let isPlaying = false;
    let score = 0;
    let highScore = parseInt(localStorage.getItem('flappy_high') || '0', 10);
    highEl.innerText = highScore;

    const orb = { x: 70, y: 220, r: 12, vy: 0, gravity: 0.35, jump: -6.5 };
    let pipes = [];
    let particles = [];
    let frame = 0;

    function startGame() {
      score = 0;
      scoreEl.innerText = '0';
      orb.y = 220;
      orb.vy = 0;
      pipes = [];
      particles = [];
      frame = 0;
      startOverlay.classList.add('hidden');
      endOverlay.classList.add('hidden');
      isPlaying = true;
      requestAnimationFrame(loop);
    }

    function flap() {
      if (!isPlaying) return;
      orb.vy = orb.jump;
      beep(520, 'sine', 0.07);
      // Spawn trail
      for (let i = 0; i < 5; i++) {
        particles.push({
          x: orb.x - orb.r,
          y: orb.y + (Math.random() - 0.5) * 6,
          vx: -2 - Math.random() * 2,
          vy: (Math.random() - 0.5) * 2,
          life: 15,
          color: '#c084fc'
        });
      }
    }

    window.addEventListener('keydown', e => {
      if (e.key === ' ') {
        flap();
        e.preventDefault();
      }
    });

    document.getElementById('box').addEventListener('mousedown', flap);
    document.getElementById('box').addEventListener('touchstart', e => {
      e.preventDefault();
      flap();
    }, { passive: false });

    function loop() {
      if (!isPlaying) return;

      frame++;
      orb.vy += orb.gravity;
      orb.y += orb.vy;

      // Spawn pipes
      if (frame % 85 === 0) {
        const gap = 110;
        const topH = Math.floor(Math.random() * (canvas.height - gap - 120)) + 40;
        pipes.push({
          x: canvas.width,
          w: 48,
          topH: topH,
          bottomY: topH + gap,
          passed: false
        });
      }

      // Update pipes
      pipes.forEach(p => {
        p.x -= 2.6;

        // Score
        if (!p.passed && p.x + p.w < orb.x) {
          p.passed = true;
          score++;
          scoreEl.innerText = score;
          beep(780, 'triangle', 0.09);
          if (score > highScore) {
            highScore = score;
            highEl.innerText = highScore;
            localStorage.setItem('flappy_high', highScore);
          }
        }

        // Collision check
        if (orb.x + orb.r > p.x && orb.x - orb.r < p.x + p.w) {
          if (orb.y - orb.r < p.topH || orb.y + orb.r > p.bottomY) {
            gameOver();
          }
        }
      });

      pipes = pipes.filter(p => p.x > -60);

      // Floor / ceiling collision
      if (orb.y + orb.r >= canvas.height || orb.y - orb.r <= 0) {
        gameOver();
      }

      // Update particles
      particles.forEach(pt => {
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life--;
      });
      particles = particles.filter(pt => pt.life > 0);

      render();
      if (isPlaying) requestAnimationFrame(loop);
    }

    function gameOver() {
      isPlaying = false;
      beep(180, 'sawtooth', 0.3);
      endDesc.innerText = `Final Score: ${score} · High Score: ${highScore}`;
      endOverlay.classList.remove('hidden');
    }

    function render() {
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Stars
      ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.fillRect(50, 80, 2, 2);
      ctx.fillRect(150, 40, 1.5, 1.5);
      ctx.fillRect(250, 120, 2, 2);
      ctx.fillRect(320, 70, 1.5, 1.5);

      // Pipes
      pipes.forEach(p => {
        ctx.fillStyle = '#1e1b4b';
        ctx.strokeStyle = '#6366f1';
        ctx.lineWidth = 2;

        // Top pipe
        ctx.fillRect(p.x, 0, p.w, p.topH);
        ctx.strokeRect(p.x, 0, p.w, p.topH);

        // Bottom pipe
        ctx.fillRect(p.x, p.bottomY, p.w, canvas.height - p.bottomY);
        ctx.strokeRect(p.x, p.bottomY, p.w, canvas.height - p.bottomY);

        // Pipe caps
        ctx.fillStyle = '#4f46e5';
        ctx.fillRect(p.x - 3, p.topH - 12, p.w + 6, 12);
        ctx.fillRect(p.x - 3, p.bottomY, p.w + 6, 12);
      });

      // Particles
      particles.forEach(pt => {
        ctx.fillStyle = pt.color;
        ctx.fillRect(pt.x, pt.y, 3, 3);
      });

      // Orb
      ctx.save();
      ctx.shadowColor = '#c084fc';
      ctx.shadowBlur = 15;
      ctx.fillStyle = '#a855f7';
      ctx.beginPath();
      ctx.arc(orb.x, orb.y, orb.r, 0, Math.PI * 2);
      ctx.fill();

      // Core
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(orb.x, orb.y, orb.r / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('restartBtn').addEventListener('click', startGame);

    render();
  </script>
</body>
</html>
