<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Minesweeper Deluxe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
      overflow: hidden;
    }
    .wrapper {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .header-bar {
      width: 100%;
      background: #0f172a;
      border-radius: 8px;
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #334155;
    }
    .counter {
      background: #020617;
      color: #ef4444;
      font-family: monospace;
      font-size: 22px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid #1e293b;
      min-width: 54px;
      text-align: center;
    }
    .face-btn {
      background: #334155;
      border: 1px solid #475569;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .face-btn:active { transform: scale(0.92); }
    .difficulty-select {
      display: flex;
      gap: 6px;
    }
    .diff-btn {
      background: #334155;
      color: #94a3b8;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .diff-btn.active { background: #3b82f6; color: #fff; border-color: #3b82f6; }
    
    .grid {
      display: grid;
      gap: 2px;
      background: #0f172a;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .cell {
      width: 28px;
      height: 28px;
      background: #334155;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: inset 1px 1px 0 rgba(255,255,255,0.1), inset -1px -1px 0 rgba(0,0,0,0.3);
    }
    .cell.revealed {
      background: #1e293b;
      box-shadow: none;
      cursor: default;
    }
    .cell.mine { background: #ef4444; color: #fff; }
    .cell.flagged { color: #f59e0b; }
    
    .c-1 { color: #38bdf8; }
    .c-2 { color: #4ade80; }
    .c-3 { color: #f87171; }
    .c-4 { color: #c084fc; }
    .c-5 { color: #fbbf24; }
    
    .touch-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #94a3b8;
      cursor: pointer;
    }
    .touch-btn {
      background: #334155;
      color: #fff;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .touch-btn.active {
      background: #f59e0b;
      color: #0f172a;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="difficulty-select">
      <button class="diff-btn active" data-diff="easy">Beginner (9x9)</button>
      <button class="diff-btn" data-diff="medium">Intermediate (16x16)</button>
    </div>

    <div class="header-bar">
      <div class="counter" id="mineCount">010</div>
      <button class="face-btn" id="faceBtn">🙂</button>
      <div class="counter" id="timer">000</div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="touch-toggle">
      <span>Touch mode:</span>
      <button class="touch-btn active" id="modeDig">⛏️ Dig</button>
      <button class="touch-btn" id="modeFlag">🚩 Flag</button>
    </div>
  </div>

  <script>
    const gridEl = document.getElementById('grid');
    const mineCountEl = document.getElementById('mineCount');
    const timerEl = document.getElementById('timer');
    const faceBtn = document.getElementById('faceBtn');
    const modeDig = document.getElementById('modeDig');
    const modeFlag = document.getElementById('modeFlag');

    let rows = 9;
    let cols = 9;
    let totalMines = 10;
    let board = [];
    let state = 'READY'; // READY, PLAYING, WON, LOST
    let timer = 0;
    let timerInterval = null;
    let touchMode = 'DIG'; // DIG or FLAG

    function initBoard() {
      state = 'READY';
      timer = 0;
      clearInterval(timerInterval);
      timerEl.innerText = '000';
      faceBtn.innerText = '🙂';
      mineCountEl.innerText = String(totalMines).padStart(3, '0');

      gridEl.style.gridTemplateColumns = `repeat(${cols}, 28px)`;
      gridEl.innerHTML = '';
      board = [];

      for (let r = 0; r < rows; r++) {
        board[r] = [];
        for (let c = 0; c < cols; c++) {
          const cell = {
            r, c,
            isMine: false,
            revealed: false,
            flagged: false,
            count: 0,
            el: document.createElement('div')
          };
          cell.el.className = 'cell';
          cell.el.addEventListener('click', () => onCellClick(r, c));
          cell.el.addEventListener('contextmenu', e => {
            e.preventDefault();
            toggleFlag(r, c);
          });
          gridEl.appendChild(cell.el);
          board[r][c] = cell;
        }
      }
    }

    function plantMines(safeR, safeC) {
      let planted = 0;
      while (planted < totalMines) {
        const r = Math.floor(Math.random() * rows);
        const c = Math.floor(Math.random() * cols);
        if (!board[r][c].isMine && !(Math.abs(r - safeR) <= 1 && Math.abs(c - safeC) <= 1)) {
          board[r][c].isMine = true;
          planted++;
        }
      }

      // Calculate neighbor counts
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (board[r][c].isMine) continue;
          let cnt = 0;
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              const nr = r + dr;
              const nc = c + dc;
              if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && board[nr][nc].isMine) cnt++;
            }
          }
          board[r][c].count = cnt;
        }
      }
    }

    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timer++;
        if (timer <= 999) {
          timerEl.innerText = String(timer).padStart(3, '0');
        }
      }, 1000);
    }

    function onCellClick(r, c) {
      if (state === 'WON' || state === 'LOST') return;
      if (touchMode === 'FLAG') {
        toggleFlag(r, c);
        return;
      }

      const cell = board[r][c];
      if (cell.flagged || cell.revealed) return;

      if (state === 'READY') {
        state = 'PLAYING';
        plantMines(r, c);
        startTimer();
      }

      if (cell.isMine) {
        gameOver(false);
        return;
      }

      reveal(r, c);
      checkWin();
    }

    function toggleFlag(r, c) {
      if (state === 'WON' || state === 'LOST') return;
      const cell = board[r][c];
      if (cell.revealed) return;

      cell.flagged = !cell.flagged;
      cell.el.classList.toggle('flagged', cell.flagged);
      cell.el.innerText = cell.flagged ? '🚩' : '';

      const flaggedCount = board.flat().filter(cell => cell.flagged).length;
      mineCountEl.innerText = String(Math.max(0, totalMines - flaggedCount)).padStart(3, '0');
    }

    function reveal(r, c) {
      const cell = board[r][c];
      if (cell.revealed || cell.flagged) return;

      cell.revealed = true;
      cell.el.classList.add('revealed');

      if (cell.count > 0) {
        cell.el.innerText = cell.count;
        cell.el.classList.add(`c-${cell.count}`);
      } else {
        // Cascade empty cells
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const nr = r + dr;
            const nc = c + dc;
            if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
              reveal(nr, nc);
            }
          }
        }
      }
    }

    function checkWin() {
      let unrevealedSafe = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (!board[r][c].isMine && !board[r][c].revealed) unrevealedSafe++;
        }
      }
      if (unrevealedSafe === 0) {
        gameOver(true);
      }
    }

    function gameOver(won) {
      state = won ? 'WON' : 'LOST';
      clearInterval(timerInterval);
      faceBtn.innerText = won ? '😎' : '😵';

      // reveal all mines
      board.flat().forEach(cell => {
        if (cell.isMine) {
          cell.el.innerText = '💣';
          cell.el.classList.add('mine');
        }
      });
    }

    faceBtn.addEventListener('click', initBoard);

    document.querySelectorAll('.diff-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if (btn.dataset.diff === 'easy') {
          rows = 9; cols = 9; totalMines = 10;
        } else {
          rows = 14; cols = 14; totalMines = 28;
        }
        initBoard();
      });
    });

    modeDig.addEventListener('click', () => {
      touchMode = 'DIG';
      modeDig.classList.add('active');
      modeFlag.classList.remove('active');
    });

    modeFlag.addEventListener('click', () => {
      touchMode = 'FLAG';
      modeFlag.classList.add('active');
      modeDig.classList.remove('active');
    });

    initBoard();
  </script>
</body>
</html>
