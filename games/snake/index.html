<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cyber Snake Arcade</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 12px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 480px;
      margin-bottom: 12px;
    }
    .score-box {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
    }
    .score-val {
      color: #10b981;
      font-weight: 700;
      font-size: 16px;
      margin-left: 6px;
    }
    .canvas-wrapper {
      position: relative;
      background: #0b1120;
      border: 2px solid #1e293b;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5), 0 0 20px rgba(16, 185, 129, 0.1);
      overflow: hidden;
    }
    canvas {
      display: block;
      background: #050811;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(5, 8, 17, 0.88);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      text-align: center;
      padding: 20px;
    }
    .overlay.hidden { display: none; }
    .overlay h2 {
      font-size: 26px;
      font-weight: 800;
      color: #10b981;
      letter-spacing: 0.5px;
    }
    .overlay p {
      font-size: 14px;
      color: #94a3b8;
      max-width: 280px;
      line-height: 1.5;
    }
    .btn {
      background: #10b981;
      color: #050811;
      border: none;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.1s, background 0.15s;
    }
    .btn:hover { background: #34d399; transform: scale(1.02); }
    .btn:active { transform: scale(0.98); }
    .d-pad {
      display: grid;
      grid-template-columns: repeat(3, 48px);
      grid-template-rows: repeat(2, 44px);
      gap: 6px;
      margin-top: 14px;
    }
    .d-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
    }
    .d-btn:active { background: #10b981; color: #050811; }
    .d-up { grid-column: 2; grid-row: 1; }
    .d-left { grid-column: 1; grid-row: 2; }
    .d-down { grid-column: 2; grid-row: 2; }
    .d-right { grid-column: 3; grid-row: 2; }
    @media (min-width: 640px) {
      .d-pad { display: none; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="score-box">SCORE <span class="score-val" id="score">0</span></div>
    <div class="score-box">HIGH <span class="score-val" id="highScore">0</span></div>
  </div>

  <div class="canvas-wrapper">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    
    <div id="startOverlay" class="overlay">
      <h2>CYBER SNAKE</h2>
      <p>Control the snake to consume quantum nodes. Avoid colliding with walls and yourself.</p>
      <button class="btn" id="startBtn">START MISSION</button>
    </div>

    <div id="gameOverOverlay" class="overlay hidden">
      <h2 style="color: #ef4444;">SIGNAL LOST</h2>
      <p id="finalScoreMsg">Your score: 0</p>
      <button class="btn" id="restartBtn">RETRY MISSION</button>
    </div>
  </div>

  <div class="d-pad">
    <button class="d-btn d-up" data-dir="UP">▲</button>
    <button class="d-btn d-left" data-dir="LEFT">◀</button>
    <button class="d-btn d-down" data-dir="DOWN">▼</button>
    <button class="d-btn d-right" data-dir="RIGHT">▶</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const finalScoreMsg = document.getElementById('finalScoreMsg');

    const GRID = 20;
    const COLS = canvas.width / GRID;
    const ROWS = canvas.height / GRID;

    let snake = [];
    let dir = { x: 1, y: 0 };
    let nextDir = { x: 1, y: 0 };
    let food = { x: 15, y: 10 };
    let score = 0;
    let highScore = parseInt(localStorage.getItem('snake_highscore') || '0', 10);
    highScoreEl.innerText = highScore;
    let gameLoop = null;
    let isPlaying = false;
    let speed = 110;

    // Web Audio synthesizer
    let audioCtx = null;
    function playTone(freq, type, duration) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function initGame() {
      snake = [
        { x: 6, y: 10 },
        { x: 5, y: 10 },
        { x: 4, y: 10 }
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      speed = 110;
      scoreEl.innerText = '0';
      spawnFood();
      startOverlay.classList.add('hidden');
      gameOverOverlay.classList.add('hidden');
      isPlaying = true;
      clearInterval(gameLoop);
      gameLoop = setInterval(step, speed);
      draw();
    }

    function spawnFood() {
      let valid = false;
      while (!valid) {
        food = {
          x: Math.floor(Math.random() * COLS),
          y: Math.floor(Math.random() * ROWS)
        };
        valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
      }
    }

    function setDirection(newDir) {
      if (!isPlaying) return;
      if (newDir.x === -dir.x && newDir.y === -dir.y) return;
      nextDir = newDir;
    }

    function step() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Wall collision
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        gameOver();
        return;
      }

      // Self collision
      if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      // Eat food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.innerText = score;
        playTone(660, 'sine', 0.12);
        if (score > highScore) {
          highScore = score;
          highScoreEl.innerText = highScore;
          localStorage.setItem('snake_highscore', highScore);
        }
        spawnFood();
        // Speed scaling
        if (speed > 60 && score % 40 === 0) {
          speed -= 4;
          clearInterval(gameLoop);
          gameLoop = setInterval(step, speed);
        }
      } else {
        snake.pop();
      }

      draw();
    }

    function gameOver() {
      isPlaying = false;
      clearInterval(gameLoop);
      playTone(180, 'sawtooth', 0.35);
      finalScoreMsg.innerText = `Final Score: ${score} · High Score: ${highScore}`;
      gameOverOverlay.classList.remove('hidden');
    }

    function draw() {
      // Clear
      ctx.fillStyle = '#050811';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid lines
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1;
      for (let x = 0; x <= canvas.width; x += GRID) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y <= canvas.height; y += GRID) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // Food
      ctx.save();
      ctx.shadowColor = '#f59e0b';
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.arc(food.x * GRID + GRID / 2, food.y * GRID + GRID / 2, GRID / 2.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Snake
      snake.forEach((segment, i) => {
        ctx.save();
        if (i === 0) {
          ctx.shadowColor = '#10b981';
          ctx.shadowBlur = 10;
          ctx.fillStyle = '#34d399';
        } else {
          ctx.fillStyle = '#10b981';
        }
        ctx.beginPath();
        ctx.roundRect(segment.x * GRID + 1, segment.y * GRID + 1, GRID - 2, GRID - 2, 4);
        ctx.fill();

        // Eyes on head
        if (i === 0) {
          ctx.fillStyle = '#050811';
          const cx = segment.x * GRID + GRID / 2;
          const cy = segment.y * GRID + GRID / 2;
          ctx.beginPath();
          ctx.arc(cx + (dir.x !== 0 ? 0 : 3), cy + (dir.y !== 0 ? 0 : 3), 2, 0, Math.PI * 2);
          ctx.arc(cx - (dir.x !== 0 ? 0 : 3), cy - (dir.y !== 0 ? 0 : 3), 2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      });
    }

    // Keyboard controls
    window.addEventListener('keydown', (e) => {
      switch (e.key) {
        case 'ArrowUp':
        case 'w':
        case 'W':
          setDirection({ x: 0, y: -1 });
          break;
        case 'ArrowDown':
        case 's':
        case 'S':
          setDirection({ x: 0, y: 1 });
          break;
        case 'ArrowLeft':
        case 'a':
        case 'A':
          setDirection({ x: -1, y: 0 });
          break;
        case 'ArrowRight':
        case 'd':
        case 'D':
          setDirection({ x: 1, y: 0 });
          break;
        case ' ':
          if (!isPlaying && !startOverlay.classList.contains('hidden')) initGame();
          else if (!isPlaying && !gameOverOverlay.classList.contains('hidden')) initGame();
          break;
      }
    });

    // Touch D-Pad
    document.querySelectorAll('.d-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const d = btn.dataset.dir;
        if (d === 'UP') setDirection({ x: 0, y: -1 });
        if (d === 'DOWN') setDirection({ x: 0, y: 1 });
        if (d === 'LEFT') setDirection({ x: -1, y: 0 });
        if (d === 'RIGHT') setDirection({ x: 1, y: 0 });
      });
    });

    document.getElementById('startBtn').addEventListener('click', initGame);
    document.getElementById('restartBtn').addEventListener('click', initGame);

    draw();
  </script>
</body>
</html>
